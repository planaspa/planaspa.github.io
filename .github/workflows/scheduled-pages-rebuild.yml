name: Scheduled Pages rebuild

on:
  schedule:
    # Daily at 00:00 UTC so future-dated posts publish on their date
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger GitHub Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled GitHub Pages rebuild for dated posts"
          git push
